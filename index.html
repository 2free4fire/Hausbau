<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hausbegehung</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
</head>
<body style="margin:0">
  <a-scene>
    <a-assets>
      <a-asset-item id="haus-modell" src="grundriss.glb"></a-asset-item>
    </a-assets>

    <!-- Dein Grundriss als 3D-Modell, in echten Metern -->
    <a-entity gltf-model="#haus-modell" position="0 0 0" shadow="cast: true; receive: true"></a-entity>

    <!-- Licht -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="2 4 2"></a-entity>

    <!-- Spieler: Joystick-Bewegung (movement-controls aus aframe-extras) + Blickrichtung per Headset -->
    <a-entity id="rig" movement-controls="speed: 0.12" position="0 1.7 5">
      <a-entity camera look-controls></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
    </a-entity>

    <a-sky color="#e8e8e8"></a-sky>
  </a-scene>
</body>
</html>
